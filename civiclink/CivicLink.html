{% extends "base.html" %}
{% block content %}
    <h1>Civic Links</h1>
    <ul>
        {% for link in civic_links %}
            <li>
                <a href="{{ link.url }}" target="_blank">{{ link.name }}</a>
                <p>{{ link.description }}</p>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
